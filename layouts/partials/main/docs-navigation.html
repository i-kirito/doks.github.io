{{ if or .Prev .Next -}}
	<div class="docs-navigation d-flex flex-column flex-md-row gap-3 justify-content-between">
	<!-- https://www.feliciano.tech/blog/custom-sort-hugo-single-pages/ -->
	{{ $pages := where site.RegularPages "Section" .Section -}}
	{{ with $pages.Next . -}}
		<a class="docs-nav-card docs-nav-prev" href="{{ .RelPermalink }}">
			<div class="card">
				<div class="card-body">
					<span>上一篇</span>
					<strong>&larr; {{ .Title }}</strong>
				</div>
			</div>
		</a>
	{{ end -}}
	{{ with $pages.Prev . -}}
		<a class="docs-nav-card docs-nav-next ms-md-auto" href="{{ .RelPermalink }}">
			<div class="card">
				<div class="card-body">
					<span>下一篇</span>
					<strong>{{ .Title }} &rarr;</strong>
				</div>
			</div>
		</a>
	{{ end -}}
	</div>
{{ end -}}
